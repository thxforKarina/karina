<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Для Карины</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;overflow-x:hidden;user-select:none;-webkit-user-select:none}
        .section{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;position:relative}
        video{width:100%;height:100%;object-fit:contain}
        .text-section{background:#000;flex-direction:column;gap:20px;padding:20px}
        .text-section h1{color:#fff;font-size:36px;text-align:center;font-family:'Arial',sans-serif;animation:fadeIn 2s ease}
        .text-section p{color:#ccc;font-size:20px;text-align:center;font-family:'Arial',sans-serif;max-width:80%;line-height:1.6;animation:fadeIn 3s ease}
        .heart{color:#ff4d4d;font-size:40px;animation:pulse 1.5s infinite}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
        #playButton{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;padding:30px 60px;font-size:28px;background:rgba(255,255,255,0.9);border:none;border-radius:60px;cursor:pointer;font-weight:bold;letter-spacing:2px;color:#000;display:none;box-shadow:0 0 50px rgba(255,255,255,0.5)}
        #playButton:hover{background:#fff;box-shadow:0 0 80px rgba(255,255,255,0.8)}
        .scroll-hint{position:absolute;bottom:30px;color:#fff;font-size:16px;animation:bounce 2s infinite;opacity:0.7}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
    </style>
</head>
<body>

    <!-- Видео -->
    <div class="section">
        <video id="myVideo" autoplay playsinline loop preload="auto">
            <source src="https://github.com/thxforKarina/karina/releases/download/v3.0/Karina.mp4" type="video/mp4">
        </video>
        <div class="scroll-hint">↓ листай вниз ↓</div>
        <button id="playButton">▶ СМОТРЕТЬ</button>
    </div>

    <!-- Текст -->
    <div class="section text-section">
        <span class="heart">❤️</span>
        <h1>Карина</h1>
        <p>Ты самое прекрасное, что случилось в моей жизни. Этот момент — для тебя.</p>
        <span class="heart">❤️</span>
    </div>

    <script>
        const video=document.getElementById('myVideo');
        const playButton=document.getElementById('playButton');
        function playVideoWithSound(){
            video.muted=false;
            video.play().then(()=>{
                playButton.style.display='none';
            }).catch(()=>{
                video.muted=true;
                video.play().then(()=>{
                    playButton.style.display='block';
                }).catch(()=>{
                    playButton.style.display='block';
                });
            });
        }
        if(video.paused){
            playVideoWithSound();
        }else{
            video.muted=false;
            if(video.paused){
                video.muted=true;
                video.play();
                playButton.style.display='block';
            }
        }
        playButton.addEventListener('click',function(){
            video.muted=false;
            video.play().then(()=>{
                playButton.style.display='none';
            }).catch(()=>{
                video.muted=true;
                video.play();
                playButton.style.display='none';
            });
        });
        document.body.addEventListener('click',function(){
            if(video.paused){
                video.muted=false;
                video.play().catch(()=>{
                    video.muted=true;
                    video.play();
                });
                playButton.style.display='none';
            }
        });
    </script>
</body>
</html>
